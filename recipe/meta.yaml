{% set name = "korean_lunar_calendar" %}
{% set version = "0.4.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: be56f27bc0594fdbbdf7bbe00f504a9f929a31e311bd7d9bb93561b645afade7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<36]

requirements:
  host:
    - pip
    - python
    - wheel
    - setuptools
  run:
    - python

test:
  imports:
    - korean_lunar_calendar
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/usingsky/korean_lunar_calendar_py
  summary: Korean Lunar Calendar
  license: MIT
  license_family: MIT
  license_file: LICENSE
  description: |
    Korean calendar and Chinese calendar is same lunar calendar but have different date.
  dev_url: https://github.com/usingsky/korean_lunar_calendar_py
  doc_url: https://github.com/usingsky/korean_lunar_calendar_py

extra:
  recipe-maintainers:
    - synapticarbors
